[project]
name = "homepulse"
version = "0.1.0"
description = "HomePulse API — home energy and water monitoring backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi[standard]>=0.142.4",
    "httpx2>=2.13.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.fastapi]
entrypoint = "homepulse.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
